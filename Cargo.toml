[package]
name = "bombicat"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "bombicat"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
resvg = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rayon = "1"
dirs = "5"
